name: 144-Journal Metadata Monitor
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Collect metadata only (this workflow never sends mail)'
        default: false
  schedule:
    - cron: '13 20 * * *'  # 05:13 JST; allow time for ChatGPT's 08:00 verification
permissions:
  contents: write
concurrency:
  group: journal-monitor-daily
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect metadata for all 144 journals (major 80 first)
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          python monitor.py ${{ inputs.dry_run && '--dry-run' || '' }}
          echo "MONITOR_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Preserve daily diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-digest-${{ github.run_id }}
          path: |
            state/latest-report.json
            state/latest-digest.txt
            state/latest-candidates.json
          if-no-files-found: ignore
      - name: Commit state and results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state/
          if ! git diff --cached --quiet; then
            git commit -m 'Update journal monitoring status'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Signal pipeline failure
        if: env.MONITOR_EXIT != '0'
        run: |
          echo 'The metadata scan could not finish; see the diagnostic artifact.' >&2
          exit 1