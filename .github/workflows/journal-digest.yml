name: 145-Journal Metadata Monitor
on:
  push:
    branches: [master]
    paths:
      - 'monitor.py'
      - 'build_daily.py'
      - 'data/journals.json'
      - 'state/registry.json'
      - '.github/workflows/journal-digest.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Collect metadata only (this workflow never sends mail)'
        default: false
  schedule:
    - cron: '13 17 * * *'  # 02:13 JST; extra buffer for delayed GitHub runs before 08:00 digest
permissions:
  contents: write
concurrency:
  group: journal-monitor-daily
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python and priority registry
        run: |
          python -m py_compile monitor.py build_daily.py
          python - <<'PY'
          import json
          from pathlib import Path
          journals = json.loads(Path('data/journals.json').read_text(encoding='utf-8'))['journals']
          registry = json.loads(Path('state/registry.json').read_text(encoding='utf-8'))
          major = {'Springer Nature', 'Cambridge University Press', 'Wiley',
                   'Oxford University Press', 'SAGE', 'Taylor & Francis', 'University of Chicago Press'}
          selected = [j for j in journals if j['platform'] in major]
          assert len(journals) == 145 and len(selected) == 90
          assert len({j['id'] for j in journals}) == len(journals), 'Duplicate journal ID'
          philosophy = next(j for j in journals if j['journal'] == 'Philosophy')
          assert philosophy['site'] == 'https://www.cambridge.org/core/journals/philosophy/firstview'
          assert registry[philosophy['id']]['issn'] == '0031-8191'
          missing = [j['journal'] for j in selected if not registry.get(j['id'],{}).get('issn')]
          print(f'Manifest validated: {len(journals)} total, {len(selected)} priority. Missing ISSNs: {missing}')
          from build_daily import kind_guess, extract_publisher
          assert kind_guess('To Our Guest Reviewers: Thank You') == 'likely_nonresearch'
          assert kind_guess('A New Theory of Law') == 'research_candidate_unverified'
          assert kind_guess('Hobbes and Political Contractarianism, written by D. P. Gauthier') == 'likely_nonresearch'
          fake = '<meta name="citation_doi" content="10.1007/test"><meta name="citation_online_date" content="2026/10/20"><meta name="citation_abstract" content="' + ('A sample of a publisher abstract. ' * 15) + '">'
          assert extract_publisher(fake, '10.1007/test')['online_date'] == '2026-10-20'
          assert not extract_publisher(fake, '10.1007/different')['doi_matched']
          from build_daily import publisher_urls, abstract_review
          wiley = '<meta name="citation_doi" content="10.1111/test"><p>First published: 29 October 2026</p>'
          assert extract_publisher(wiley, '10.1111/test')['online_date'] == '2026-10-29'
          assert extract_publisher(wiley, '10.1111/wrong')['doi_matched'] is False
          assert len(publisher_urls('https://doi.org/10.1111/test', '10.1111/test', '2026-10-29')) >= 2
          assert '/2026/10/27/' in ' '.join(publisher_urls('https://doi.org/10.1136/test', '10.1136/test', '2026-10-28'))
          assert abstract_review('https://example.org/figure.png') == 'suspect_media_link'
          assert abstract_review('This essay argues that social structures shape normative practices through institutional action and public participation.') == 'present_needs_content_review'
          print('Daily extraction safeguards passed')
          PY
      - name: Collect metadata for all 145 journals (major 90 first)
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          python monitor.py ${{ inputs.dry_run && '--dry-run' || '' }}
          echo "MONITOR_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Build yesterday/today shortlist and recover missing abstracts
        if: env.MONITOR_EXIT == '0'
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python build_daily.py
      - name: Preserve daily diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-digest-${{ github.run_id }}
          path: |
            state/latest-report.json
            state/latest-digest.txt
            state/latest-candidates.json
            state/latest-daily.json
          if-no-files-found: ignore
      - name: Commit state and results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state/
          if ! git diff --cached --quiet; then
            git commit -m 'Update journal monitoring status'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Signal pipeline failure
        if: env.MONITOR_EXIT != '0'
        run: |
          echo 'The metadata scan could not finish; see the diagnostic artifact.' >&2
          exit 1